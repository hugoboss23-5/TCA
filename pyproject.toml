[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tca"
version = "0.1.0"
description = "Topological Cognitive Architecture — a calculator for structural problems in any system"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
    "fastapi>=0.100.0",
    "starlette>=0.27.0",
    "uvicorn>=0.24.0",
    "sse-starlette>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["tca*"]
